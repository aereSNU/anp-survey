<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 응답 변환기</title>
<style>
body{font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;max-width:860px;margin:32px auto;padding:0 16px;color:#1f2a1f;line-height:1.6}
h1{font-size:1.4rem}label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid #cfd8cc;border-radius:8px}
textarea{height:220px;font-family:ui-monospace,monospace;font-size:.85rem}
button{background:#3d6b4a;color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;cursor:pointer;margin-top:12px}
.muted{color:#666;font-size:.9rem}.err{color:#b3261e}.ok{color:#2e7d32}
table{border-collapse:collapse;width:100%;font-size:.85rem;margin-top:10px}td,th{border:1px solid #dde3da;padding:4px 6px;text-align:left}
.code{font-family:ui-monospace,monospace;font-size:.75rem;word-break:break-all;background:#f3f6f1;border:1px solid #dde3da;border-radius:8px;padding:10px;max-height:140px;overflow:auto;user-select:all}
</style></head><body>
<h1>AI 응답 변환기</h1>
<p class="muted">AI가 낸 답변(문항,선택,강도,근거)을 붙여 넣으면 설문 응답 코드로 바꿉니다. 이 코드는 <b>AI 응답 전용 시트</b>의 [AHP → 응답 코드 불러오기]에 넣으세요. 사람 응답 시트에는 넣지 마세요.</p>
<label>응답자 이름 (이 AI를 사용한 응답자)</label><input id="who" placeholder="예: 홍길동">
<label>AI 모델</label><input id="model" placeholder="예: ChatGPT-5 / Claude Opus 5.5">
<label>AI 답변 붙여 넣기</label><textarea id="raw" placeholder="문항,선택,강도,근거&#10;Q01,A,3,...&#10;..."></textarea>
<button id="go">변환하기</button>
<div id="out"></div>
<script>
const QMAP=[["Q01","G","0-1","환경","사회"],["Q02","G","0-2","환경","경제"],["Q03","G","1-2","사회","경제"],["Q04","E","0-1","토양","수질"],["Q05","E","0-2","토양","대기"],["Q06","E","0-3","토양","생태"],["Q07","E","1-2","수질","대기"],["Q08","E","1-3","수질","생태"],["Q09","E","2-3","대기","생태"],["Q10","S","0-1","인적 기반","영농 활동"],["Q11","S","0-2","인적 기반","지역 사회"],["Q12","S","1-2","영농 활동","지역 사회"],["Q13","C","0-1","수익성","생산성"],["Q14","C","0-2","수익성","안정성"],["Q15","C","1-2","생산성","안정성"],["Q16","N.E1.C","0-1","수익성","생산성"],["Q17","N.E2.S","0-1","인적 기반","영농 활동"],["Q18","N.E2.C","0-1","수익성","생산성"],["Q19","N.E4.E","0-1","토양","수질"],["Q20","N.E4.S","0-1","인적 기반","영농 활동"],["Q21","N.E4.C","0-1","수익성","생산성"],["Q22","N.S1.S","0-1","영농 활동","지역 사회"],["Q23","N.S1.C","0-1","수익성","생산성"],["Q24","N.S1.C","0-2","수익성","안정성"],["Q25","N.S1.C","1-2","생산성","안정성"],["Q26","N.S2.E","0-1","토양","수질"],["Q27","N.S2.E","0-2","토양","대기"],["Q28","N.S2.E","0-3","토양","생태"],["Q29","N.S2.E","1-2","수질","대기"],["Q30","N.S2.E","1-3","수질","생태"],["Q31","N.S2.E","2-3","대기","생태"],["Q32","N.S2.S","0-1","인적 기반","지역 사회"],["Q33","N.S2.C","0-1","수익성","생산성"],["Q34","N.S2.C","0-2","수익성","안정성"],["Q35","N.S2.C","1-2","생산성","안정성"],["Q36","N.S3.S","0-1","인적 기반","영농 활동"],["Q37","N.S3.C","0-1","수익성","생산성"],["Q38","N.C1.E","0-1","토양","수질"],["Q39","N.C1.E","0-2","토양","대기"],["Q40","N.C1.E","0-3","토양","생태"],["Q41","N.C1.E","1-2","수질","대기"],["Q42","N.C1.E","1-3","수질","생태"],["Q43","N.C1.E","2-3","대기","생태"],["Q44","N.C1.S","0-1","인적 기반","영농 활동"],["Q45","N.C1.S","0-2","인적 기반","지역 사회"],["Q46","N.C1.S","1-2","영농 활동","지역 사회"],["Q47","N.C1.C","0-1","생산성","안정성"],["Q48","N.C2.E","0-1","토양","수질"],["Q49","N.C2.E","0-2","토양","대기"],["Q50","N.C2.E","0-3","토양","생태"],["Q51","N.C2.E","1-2","수질","대기"],["Q52","N.C2.E","1-3","수질","생태"],["Q53","N.C2.E","2-3","대기","생태"],["Q54","N.C2.S","0-1","인적 기반","영농 활동"],["Q55","N.C2.S","0-2","인적 기반","지역 사회"],["Q56","N.C2.S","1-2","영농 활동","지역 사회"],["Q57","N.C2.C","0-1","수익성","안정성"],["Q58","N.C3.S","0-1","인적 기반","영농 활동"],["Q59","N.C3.S","0-2","인적 기반","지역 사회"],["Q60","N.C3.S","1-2","영농 활동","지역 사회"],["Q61","N.C3.C","0-1","수익성","생산성"],["Q62","K.E","0-1","환경 부문 내부","사회 부문"],["Q63","K.E","0-2","환경 부문 내부","경제 부문"],["Q64","K.E","1-2","사회 부문","경제 부문"],["Q65","K.S","0-1","환경 부문","사회 부문 내부"],["Q66","K.S","0-2","환경 부문","경제 부문"],["Q67","K.S","1-2","사회 부문 내부","경제 부문"],["Q68","K.C","0-1","환경 부문","사회 부문"],["Q69","K.C","0-2","환경 부문","경제 부문 내부"],["Q70","K.C","1-2","사회 부문","경제 부문 내부"]];
const GSIZE={"G":3,"E":4,"S":3,"C":3,"N.E1.C":2,"N.E2.S":2,"N.E2.C":2,"N.E4.E":2,"N.E4.S":2,"N.E4.C":2,"N.S1.S":2,"N.S1.C":3,"N.S2.E":4,"N.S2.S":2,"N.S2.C":3,"N.S3.S":2,"N.S3.C":2,"N.C1.E":4,"N.C1.S":3,"N.C1.C":2,"N.C2.E":4,"N.C2.S":3,"N.C2.C":2,"N.C3.S":3,"N.C3.C":2,"K.E":3,"K.S":3,"K.C":3};
const RI=[0,0,0,0.58,0.90,1.12,1.24,1.32,1.41,1.45,1.49];
const sToA=s=>s<9?10-s:s===9?1:1/(s-8);
function cr(n,s){const A=[...Array(n)].map(()=>Array(n).fill(1));for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=sToA(s[i+"-"+j]);A[i][j]=a;A[j][i]=1/a;}
 const gm=A.map(r=>Math.pow(r.reduce((x,y)=>x*y,1),1/n));const t=gm.reduce((x,y)=>x+y,0);const w=gm.map(g=>g/t);
 const lam=A.map(r=>r.reduce((a,v,j)=>a+v*w[j],0)).reduce((a,v,i)=>a+v/w[i],0)/n;return n>2?Math.max(0,((lam-n)/(n-1))/RI[n]):0;}
const esc=x=>String(x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
document.getElementById("go").onclick=()=>{
  const out=document.getElementById("out"),who=document.getElementById("who").value.trim(),model=document.getElementById("model").value.trim();
  const errs=[],ans={};
  for(const line of document.getElementById("raw").value.split(/\r?\n/)){
    const m=line.replace(/[`"]/g,"").match(/^\s*Q0*(\d+)\s*[,\t|]\s*([AaBb=])\s*[,\t|]\s*(\d+)\s*(?:[,\t|]\s*(.*))?$/); if(!m) continue;
    const no=+m[1],ch=m[2].toUpperCase(),k=+m[3];
    if(no<1||no>QMAP.length){errs.push(`Q${no}: 없는 문항 번호`);continue;}
    if(k<1||k>9){errs.push(`Q${no}: 강도는 1~9여야 합니다`);continue;}
    ans[no]={ch,k:ch==="="?1:k,why:(m[4]||"").trim()};
  }
  QMAP.forEach((q,i)=>{if(!ans[i+1])errs.push(`${q[0]}: 답이 없습니다`);});
  if(!who)errs.push("응답자 이름을 입력해 주세요");
  if(errs.length){out.innerHTML=`<p class="err">${errs.length}건을 확인해 주세요.</p><ul class="err">${errs.slice(0,20).map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`;return;}
  const groups={};
  QMAP.forEach(([id,g,key],i)=>{const a=ans[i+1];groups[g]=groups[g]||{s:{},override:false,blocked:0};
    groups[g].s[key]=a.ch==="="||a.k===1?9:a.ch==="A"?10-a.k:8+a.k;});
  const crs=[];for(const g in groups){const n=GSIZE[g];const c=cr(n,groups[g].s);groups[g].cr=+c.toFixed(4);if(n>2)crs.push([g,c]);}
  const payload={schema:3,evaluator:who+"_AI",ai_model:model,groups,submittedAt:new Date().toISOString()};
  const code="AHP2:"+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  const bad=crs.filter(x=>x[1]>0.1);
  out.innerHTML=`<p class="ok">70문항을 모두 읽었습니다. 응답자 이름은 <b>${esc(who)}_AI</b>로 저장됩니다.</p>
   <p class="muted">일관성(CR) 0.1 초과 묶음: ${bad.length?bad.map(x=>`${x[0]} (${x[1].toFixed(3)})`).join(", "):"없음"}</p>
   <label>응답 코드</label><div class="code" id="code">${code}</div><button id="cp">코드 복사</button>
   <table><tr><th>문항</th><th>A</th><th>B</th><th>선택</th><th>강도</th><th>근거</th></tr>${QMAP.map((q,i)=>{const a=ans[i+1];return `<tr><td>${q[0]}</td><td>${esc(q[3])}</td><td>${esc(q[4])}</td><td>${a.ch}</td><td>${a.k}</td><td>${esc(a.why)}</td></tr>`}).join("")}</table>`;
  document.getElementById("cp").onclick=()=>navigator.clipboard.writeText(code).then(()=>alert("복사했습니다"));
};
</script></body></html>
